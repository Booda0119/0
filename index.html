      var reason = event.error;
      var msg = 'Unhandled error\n';
      if (reason) {
        msg += reason + '\n';
        if (reason.sourceURL)
          msg += reason.sourceURL;
        if (reason.line)
          msg += ':' + reason.line;
        if (reason.column)
          msg += ':' + reason.column;
        if (reason.stack)
          msg += '\n' + reason.stack;
      } else {
        msg += 'No error object';
      }
      alert(msg);
      return true;
    });

    // Dynamic 6.72 entrypoint loader
    window.addEventListener('load', function () {
      var ua = navigator.userAgent;
      var isPS4 = ua.indexOf("PlayStation 4") !== -1;

    window.checkPlatformIsSupported = function () {
      var userAgent = navigator.userAgent;
      var psRegex = /PlayStation (4|5)[ \/]([0-9]{1,2}\.[0-9]{2})/;
      var match = userAgent.match(psRegex);
      if (!match) return false;

        "4": ["5.05", "6.70", "6.71", "6.72",

              "9.00", "9.03", "9.04", "9.50", "9.51", "9.60"],
        "5": ["0.00"]

      // Check device exists

    // مراقب رسائل النجاح والفشل

      // دالة إظهار الفشل
      function triggerFailure() {
        if (isFinished) return;
        isFinished = true;
        resultElement.textContent = "فشل تفعيل جولد هين! أعد تشغيل البلايستيشن وحاول مرة أخرى";
        resultElement.classList.add("fail");
        observer.disconnect();
      }

      // دالة إظهار النجاح اللحظي
      function triggerSuccess() {
        if (isFinished) return;
        isFinished = true;
        resultElement.textContent = "تم تفعيل جولد هين بنجاح...يمكنك الآن إغلاق المتصفح";
        resultElement.classList.add("success");
        observer.disconnect();
      }

      // دالة لفحص محتوى الصفحة والبحث عن الكلمات المفتاحية
      function checkPageText() {
        if (isFinished || !document.body) return false;
        var pageText = (document.body.innerText || document.body.textContent || "").toLowerCase();

        // الفحص عن الفشل بكلمة "restart"
        if (pageText.indexOf("restart") !== -1) {
          triggerFailure();
          return true;
        }

        // الفحص عن النجاح بالكلمة الجديدة "loaded"
        if (pageText.indexOf("loaded") !== -1) {
          triggerSuccess();
          return true;
        }

        return false;
      }

      var observer = new MutationObserver(function() {
        checkPageText();
      });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
        checkPageText();
      }
    })();
